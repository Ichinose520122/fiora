# Run this stack on the mainland China host, independently from the chat stack.
services:
  netease:
    image: ghcr.io/ichinose520122/fiora:music-api
    build:
      context: ..
      dockerfile: deploy/Dockerfile.netease
    restart: unless-stopped
    environment:
      MusicAuthToken: ${NETEASE_API_TOKEN:?NETEASE_API_TOKEN is required}
      MusicAccountFile: /music-auth/account.json
    volumes:
      - music_account:/music-auth
    ports:
      - "127.0.0.1:${NETEASE_BIND_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health',{signal:AbortSignal.timeout(3000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"

  caddy:
    profiles: ["https"]
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      NETEASE_DOMAIN: ${NETEASE_DOMAIN:?NETEASE_DOMAIN is required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile.netease:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      netease:
        condition: service_healthy

volumes:
  music_account:
  caddy_data:
  caddy_config:
