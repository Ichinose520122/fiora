name: Bot gateway presence regression tests
on:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  presence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --prefix "$RUNNER_TEMP/bot-gateway-deps" --ignore-scripts --no-save ws@7.5.3
      - run: node --experimental-vm-modules --test packages/server/test/botGatewayPresence.test.mjs
        env:
          FIORA_GATEWAY_TEST_DEPS: ${{ runner.temp }}/bot-gateway-deps
