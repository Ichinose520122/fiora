name: Build Android review APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fiora-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: packages/app
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: packages/app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install App dependencies
        run: npm ci --no-audit --no-fund
      - name: Check native TypeScript
        run: npm run typecheck
      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install
      # The Expo template signs release variants with its debug key. This is a
      # standalone review APK with bundled JS, not a store release/signing setup.
      - name: Build standalone review APK
        working-directory: packages/app/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a
      - uses: actions/upload-artifact@v4
        with:
          name: fiora-android-review-${{ github.sha }}
          path: packages/app/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
