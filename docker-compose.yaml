version: '3.2'

services:
  mongodb:
    image: mongo
    restart: always
  redis:
    image: redis
    restart: always
  fiora:
    build: .
    restart: always
    ports:
      - "9200:9200"
    environment:
  - Database=mongodb://mongodb/fiora
  - RedisHost=redis
  - JwtSecret=${FIORA_JWT_SECRET}
  - InviteCode=${FIORA_INVITE_CODE}
  - DisableRegister=${FIORA_DISABLE_REGISTER:-false}
